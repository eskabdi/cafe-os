# Supabase local development config for CafeOS.
project_id = "cafe-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
# Password policy for the accounts that really use passwords (tenant_admin, platform admins). PIN staff have random
# unusable passwords and are additionally blocked from password sign-in by the hook below.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
anonymous_users = 10

# Platform admins and tenant admins can enrol TOTP; the database requires aal2 for platform admins
# (migration 0015, fn_platform_mfa_satisfied) and offers step-up for destructive tenant-admin RPCs.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# SM7: PIN staff must never sign in (or set a password) through GoTrue. Postgres hook, runs as supabase_auth_admin.
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/fn_auth_password_verification_hook"

[auth.email]
enable_signup = false
double_confirm_changes = true
secure_password_change = true
# LOCAL ONLY: confirmations are off so the demo seed users and Inbucket flows work without mail round trips.
# Production MUST set "Confirm email" = ON in the hosted Auth settings. fn_provision_tenant additionally refuses an
# owner whose auth.users.email_confirmed_at is null (p_require_confirmed defaults to true; only service_role, i.e. the
# seed / CI, may pass false).
enable_confirmations = false

# Edge Functions. pin-login is called before sign-in with the anon key (a JWT, so verify_jwt = true still passes);
# staff-create additionally verifies the caller's user JWT itself. Secrets (PIN_PEPPER, ALLOWED_ORIGINS) are set with
# `supabase secrets set`, never here. See supabase/functions/README.md.
[functions.pin-login]
verify_jwt = true

[functions.staff-create]
verify_jwt = true

[functions.staff-roster]
verify_jwt = true
