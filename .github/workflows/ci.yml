name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # cancel superseded PR runs only; never cancel a push run on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # secret scan covers full history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # fails on high/critical advisories in production dependencies
      - run: pnpm audit --audit-level=high --prod
      - name: Secret scan (gitleaks, checksum-verified binary)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose
          rm -f gitleaks gitleaks.tgz
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint # includes forbidden-pattern scan of src/ and supabase/migrations
      - run: pnpm test -- --run
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Lint migrations (forbidden patterns)
        run: node scripts/check-forbidden-patterns.mjs
      - name: Test layout guard (supabase test db runs EVERY .sql/.pg file under supabase/tests)
        run: |
          bad="$(find supabase/tests -type f ! -name '*.test.sql' -print)"
          if [ -n "$bad" ]; then echo "only *.test.sql pgTAP files may live in supabase/tests:"; echo "$bad"; exit 1; fi
          for f in $(find supabase/tests -type f -name '*.test.sql'); do
            grep -qE 'plan\(|no_plan\(' "$f" || { echo "no pgTAP plan in $f"; exit 1; }
          done
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0 # pinned: `latest` hit the GitHub API rate limit in CI
      - run: supabase start
      # applies supabase/migrations/*.sql then supabase/seed.sql (config.toml [db.seed] sql_paths = ["./seed.sql"])
      - run: supabase db reset
      # pgTAP: pg_prove --ext .pg --ext .sql -r supabase/tests (helpers 00_, adversarial suites 10_-16_, cleanup 99_)
      - run: supabase test db
      # the suite must be re-runnable on the same database (helper install/cleanup idempotent)
      - run: supabase test db
      - name: Helper schema must not outlive the run
        run: |
          n="$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_namespace where nspname = 'tests'")"
          test "$n" = "0"
      - if: always()
        run: supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, database]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0 # pinned: `latest` hit the GitHub API rate limit in CI
      - run: supabase start
      - run: supabase db reset
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export local Supabase public config
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed -e 's/^API_URL=/VITE_SUPABASE_URL=/' -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
